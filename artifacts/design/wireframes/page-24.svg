<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="Anuphan, 'Sukhumvit Set', -apple-system, 'Helvetica Neue', sans-serif"><rect width="1280" height="800" fill="#ffffff"/><rect x="0" y="0" width="960" height="56" rx="0" fill="#ffffff" stroke="none" /><line x1="0" x2="960" y1="56" y2="56" stroke="#d1d5db"/><rect x="24" y="14" width="28" height="28" rx="6" fill="#e5e7eb" stroke="none" /><text x="62" y="34" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start">ระบบใบเสนอราคาเครื่องเขียน</text><circle cx="920" cy="28" r="16" fill="#e5e7eb"/><text x="1192" y="29.299999999999997" font-size="14" font-weight="400" fill="#1f2937" text-anchor="end"><tspan x="1192" >สมศรี ใจดี (เจ้าของแอป)</tspan></text><ellipse cx="1228" cy="28" rx="20" ry="20" fill="#e5e7eb"/><text x="1228" y="33" font-size="12.8" font-weight="600" fill="#6b7280" text-anchor="middle">สศ</text><rect x="0" y="56" width="240" height="744" rx="0" fill="#f3f4f6" stroke="none" /><rect x="24" y="83" width="14" height="14" rx="3" fill="#d1d5db" stroke="none" /><text x="48" y="95" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">คิวคำขอ (5)</text><rect x="24" y="127" width="14" height="14" rx="3" fill="#d1d5db" stroke="none" /><text x="48" y="139" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">บันทึกคำขอแทนลูกค้า</text><rect x="24" y="171" width="14" height="14" rx="3" fill="#d1d5db" stroke="none" /><text x="48" y="183" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">ใบเสนอราคาและคำสั่งซื้อ</text><rect x="24" y="215" width="14" height="14" rx="3" fill="#d1d5db" stroke="none" /><text x="48" y="227" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">สินค้าและสต็อก</text><rect x="12" y="248" width="216" height="36" rx="8" fill="#dbeafe" stroke="none" /><rect x="24" y="259" width="14" height="14" rx="3" fill="#2563eb" stroke="none" /><text x="48" y="271" font-size="14" font-weight="600" fill="#2563eb" text-anchor="start">องค์กรและผู้ติดต่อ</text><rect x="24" y="303" width="14" height="14" rx="3" fill="#d1d5db" stroke="none" /><text x="48" y="315" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">เจ้าหน้าที่</text><rect x="24" y="347" width="14" height="14" rx="3" fill="#d1d5db" stroke="none" /><text x="48" y="359" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">คำถามที่ส่งต่อ (1)</text><rect x="24" y="391" width="14" height="14" rx="3" fill="#d1d5db" stroke="none" /><text x="48" y="403" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">ตัวชี้วัดและตั้งค่า</text><rect x="24" y="435" width="14" height="14" rx="3" fill="#d1d5db" stroke="none" /><text x="48" y="447" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">ประกาศความเป็นส่วนตัว</text><rect x="396" y="166" width="560" height="392" rx="14" fill="rgba(0,0,0,.08)" stroke="none" /><rect x="392" y="160" width="560" height="392" rx="12" fill="#ffffff" stroke="#d1d5db" /><text x="416" y="198" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">ลบข้อมูลส่วนบุคคลของผู้ติดต่อ</text><path d="M918 184l10 10m0-10l-10 10" stroke="#6b7280" stroke-width="1.6"/><text x="416" y="233.3" font-size="14" font-weight="400" fill="#6b7280" text-anchor="start"><tspan x="416" >ระบบจะแทนชื่อด้วย ข้อมูลถูกลบตามคำขอ และล้างอีเมล เบอร์โทร กับชื่อผู้ใช้ คำขอ ใบเสนอ</tspan><tspan x="416" dy="20.3">ราคา และคำสั่งซื้อเดิมยังอยู่เป็นหลักฐานทางการค้า</tspan></text><rect x="720" y="492" width="100" height="38" rx="8" fill="#ffffff" stroke="#d1d5db" /><text x="770" y="516" font-size="14" font-weight="600" fill="#1f2937" text-anchor="middle">ยกเลิก</text><rect x="832" y="492" width="96" height="38" rx="8" fill="#2563eb" stroke="#2563eb" /><text x="880" y="516" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">ยืนยัน</text><text x="424" y="365.3" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start"><tspan x="424" >ช่องทางที่ได้รับคำขอลบ</tspan></text><rect x="424" y="376" width="240" height="40" rx="6" fill="#ffffff" stroke="#d1d5db" /><text x="436" y="401" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">อีเมล</text><path d="M642 393l5 5 5-5" fill="none" stroke="#6b7280" stroke-width="1.6"/><text x="688" y="365.3" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start"><tspan x="688" >วันที่ได้รับคำขอ</tspan></text><rect x="688" y="376" width="240" height="40" rx="6" fill="#ffffff" stroke="#d1d5db" /><text x="700" y="401" font-size="14" font-weight="400" fill="#9ca3af" text-anchor="start">25 พ.ย. 2569</text><text x="696" y="513" font-size="15" font-weight="500" fill="#2563eb" text-anchor="middle">ยกเลิก</text><line x1="675.6824989318848" x2="716.3175010681152" y1="517" y2="517" stroke="#2563eb"/><rect x="784" y="488" width="144" height="40" rx="8" fill="#2563eb" stroke="#2563eb" /><text x="856" y="513" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">ยืนยันการลบ</text></svg>