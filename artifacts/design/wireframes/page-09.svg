<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="Anuphan, 'Sukhumvit Set', -apple-system, 'Helvetica Neue', sans-serif"><rect width="1280" height="800" fill="#ffffff"/><rect x="0" y="0" width="1280" height="56" rx="0" fill="#ffffff" stroke="none" /><line x1="0" x2="1280" y1="56" y2="56" stroke="#d1d5db"/><rect x="24" y="14" width="28" height="28" rx="6" fill="#e5e7eb" stroke="none" /><text x="62" y="34" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start">ระบบใบเสนอราคาเครื่องเขียน</text><circle cx="1240" cy="28" r="16" fill="#e5e7eb"/><ellipse cx="1020" cy="28" rx="20" ry="20" fill="#e5e7eb"/><text x="1020" y="33" font-size="12.8" font-weight="600" fill="#6b7280" text-anchor="middle">สศ</text><text x="1048" y="29.299999999999997" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start"><tspan x="1048" >สมศรี ใจดี (ผู้ดูแลระบบ)</tspan></text><rect x="0" y="56" width="240" height="744" rx="0" fill="#f3f4f6" stroke="none" /><rect x="24" y="83" width="14" height="14" rx="3" fill="#d1d5db" stroke="none" /><text x="48" y="95" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">คิวคำขอ (3)</text><rect x="24" y="127" width="14" height="14" rx="3" fill="#d1d5db" stroke="none" /><text x="48" y="139" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">บันทึกคำขอแทนลูกค้า</text><rect x="24" y="171" width="14" height="14" rx="3" fill="#d1d5db" stroke="none" /><text x="48" y="183" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">ใบเสนอราคาและคำสั่งซื้อ</text><rect x="24" y="215" width="14" height="14" rx="3" fill="#d1d5db" stroke="none" /><text x="48" y="227" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">สินค้าและสต็อก</text><rect x="24" y="259" width="14" height="14" rx="3" fill="#d1d5db" stroke="none" /><text x="48" y="271" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">องค์กรและผู้ติดต่อ</text><rect x="24" y="303" width="14" height="14" rx="3" fill="#d1d5db" stroke="none" /><text x="48" y="315" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">เจ้าหน้าที่</text><rect x="12" y="336" width="216" height="36" rx="8" fill="#dbeafe" stroke="none" /><rect x="24" y="347" width="14" height="14" rx="3" fill="#2563eb" stroke="none" /><text x="48" y="359" font-size="14" font-weight="600" fill="#2563eb" text-anchor="start">คำถามที่ส่งต่อ (1)</text><rect x="24" y="391" width="14" height="14" rx="3" fill="#d1d5db" stroke="none" /><text x="48" y="403" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">ตัวชี้วัดและตั้งค่า</text><rect x="24" y="435" width="14" height="14" rx="3" fill="#d1d5db" stroke="none" /><text x="48" y="447" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">ประกาศความเป็นส่วนตัว</text><text x="264" y="94.8" font-size="24" font-weight="700" fill="#1f2937" text-anchor="start"><tspan x="264" >คำถามที่แชตส่งต่อ</tspan></text><line x1="264" x2="504" y1="167" y2="167" stroke="#d1d5db"/><text x="303.177001953125" y="153" font-size="14" font-weight="600" fill="#2563eb" text-anchor="middle">ยังไม่ปิด</text><rect x="272" y="165" width="62.35400390625" height="3" rx="1.5" fill="#2563eb"/><text x="378.60500144958496" y="153" font-size="14" font-weight="500" fill="#6b7280" text-anchor="middle">ปิดแล้ว</text><rect x="264" y="184" width="992" height="160" rx="6" fill="#ffffff" stroke="#d1d5db" /><rect x="264.5" y="184.5" width="991" height="39.5" rx="5.5" fill="#f3f4f6"/><text x="276" y="209" font-size="13.5" font-weight="600" fill="#6b7280" text-anchor="start">วันที่</text><text x="474.4" y="209" font-size="13.5" font-weight="600" fill="#6b7280" text-anchor="start">องค์กร</text><text x="672.8" y="209" font-size="13.5" font-weight="600" fill="#6b7280" text-anchor="start">คำถาม (ปกปิดข้อมูลแล้ว)</text><text x="871.2" y="209" font-size="13.5" font-weight="600" fill="#6b7280" text-anchor="start">เหตุผล</text><text x="1069.6" y="209" font-size="13.5" font-weight="600" fill="#6b7280" text-anchor="start">สถานะ</text><line x1="264" x2="1256" y1="224" y2="224" stroke="#d1d5db"/><text x="276" y="249" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">25 พ.ย. 2569</text><text x="474.4" y="249" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">โรงเรียนวัดสุทธิวราราม</text><text x="672.8" y="249" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">ปากกาที่สั่งเมื่อเดือนก่อนชำรุด …</text><text x="871.2" y="249" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">ร้องเรียน</text><text x="1069.6" y="249" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">ยังไม่ปิด</text><line x1="264" x2="1256" y1="264" y2="264" stroke="#d1d5db"/><text x="276" y="289" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">24 พ.ย. 2569</text><text x="474.4" y="289" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">โรงเรียนอนุบาลบ้านดอกไม้</text><text x="672.8" y="289" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">ขอแบบเดิมที่เคยสั่งเมื่อปีก่อน</text><text x="871.2" y="289" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">ความมั่นใจต่ำ</text><text x="1069.6" y="289" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">ปิดแล้ว</text><line x1="264" x2="1256" y1="304" y2="304" stroke="#d1d5db"/><text x="276" y="329" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">23 พ.ย. 2569</text><text x="474.4" y="329" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">บริษัท รุ่งเรืองการพิมพ์ จำกัด</text><text x="672.8" y="329" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">มีกระดาษสีชมพูไหม</text><text x="871.2" y="329" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">รหัสสินค้าไม่ตรง</text><text x="1069.6" y="329" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">ปิดแล้ว</text><text x="264" y="381.3" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start"><tspan x="264" >หมายเหตุการปิดรายการ</tspan></text><rect x="264" y="392" width="700" height="80" rx="6" fill="#ffffff" stroke="#d1d5db" /><text x="276" y="415.3" font-size="14" font-weight="400" fill="#9ca3af" text-anchor="start"><tspan x="276" >โทรกลับลูกค้าแล้ว นัดส่งสินค้าทดแทน</tspan></text><path d="M958 458l-8 8M958 463l-3 3" stroke="#9ca3af"/><rect x="264" y="488" width="160" height="40" rx="8" fill="#2563eb" stroke="#2563eb" /><text x="344" y="513" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">ปิดรายการ</text><path d="M264 552h974l18 18v30h-992z" fill="#fef9c3" stroke="#eab308"/><path d="M1238 552v18h18" fill="none" stroke="#eab308"/><text x="276" y="574.35" font-size="13" font-weight="400" fill="#713f12" text-anchor="start"><tspan x="276" >ระบบเก็บเฉพาะคำถามที่ปกปิดอีเมลและเบอร์โทรแล้ว ไม่เก็บคำตอบ และลบอัตโนมัติเมื่อครบ 90 วัน</tspan></text></svg>