<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="Anuphan, 'Sukhumvit Set', -apple-system, 'Helvetica Neue', sans-serif"><rect width="1280" height="800" fill="#ffffff"/><rect x="0" y="0" width="1280" height="56" rx="0" fill="#ffffff" stroke="none" /><line x1="0" x2="1280" y1="56" y2="56" stroke="#d1d5db"/><rect x="24" y="14" width="28" height="28" rx="6" fill="#e5e7eb" stroke="none" /><text x="62" y="34" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start">ระบบใบเสนอราคาเครื่องเขียน</text><circle cx="1240" cy="28" r="16" fill="#e5e7eb"/><ellipse cx="1020" cy="28" rx="20" ry="20" fill="#e5e7eb"/><text x="1020" y="33" font-size="12.8" font-weight="600" fill="#6b7280" text-anchor="middle">สศ</text><text x="1048" y="29.299999999999997" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start"><tspan x="1048" >สมศรี ใจดี (ผู้ดูแลระบบ)</tspan></text><rect x="0" y="56" width="240" height="744" rx="0" fill="#f3f4f6" stroke="none" /><rect x="24" y="83" width="14" height="14" rx="3" fill="#d1d5db" stroke="none" /><text x="48" y="95" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">คิวคำขอ (3)</text><rect x="24" y="127" width="14" height="14" rx="3" fill="#d1d5db" stroke="none" /><text x="48" y="139" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">บันทึกคำขอแทนลูกค้า</text><rect x="24" y="171" width="14" height="14" rx="3" fill="#d1d5db" stroke="none" /><text x="48" y="183" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">ใบเสนอราคาและคำสั่งซื้อ</text><rect x="24" y="215" width="14" height="14" rx="3" fill="#d1d5db" stroke="none" /><text x="48" y="227" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">สินค้าและสต็อก</text><rect x="12" y="248" width="216" height="36" rx="8" fill="#dbeafe" stroke="none" /><rect x="24" y="259" width="14" height="14" rx="3" fill="#2563eb" stroke="none" /><text x="48" y="271" font-size="14" font-weight="600" fill="#2563eb" text-anchor="start">องค์กรและผู้ติดต่อ</text><rect x="24" y="303" width="14" height="14" rx="3" fill="#d1d5db" stroke="none" /><text x="48" y="315" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">เจ้าหน้าที่</text><rect x="24" y="347" width="14" height="14" rx="3" fill="#d1d5db" stroke="none" /><text x="48" y="359" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">คำถามที่ส่งต่อ (1)</text><rect x="24" y="391" width="14" height="14" rx="3" fill="#d1d5db" stroke="none" /><text x="48" y="403" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">ตัวชี้วัดและตั้งค่า</text><rect x="24" y="435" width="14" height="14" rx="3" fill="#d1d5db" stroke="none" /><text x="48" y="447" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">ประกาศความเป็นส่วนตัว</text><text x="264" y="94.8" font-size="24" font-weight="700" fill="#1f2937" text-anchor="start"><tspan x="264" >องค์กร ผู้ติดต่อ และราคาตามสัญญา</tspan></text><rect x="1096" y="72" width="160" height="40" rx="8" fill="#2563eb" stroke="#2563eb" /><text x="1176" y="97" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">เพิ่มองค์กร</text><rect x="264" y="128" width="280" height="40" rx="20" fill="#ffffff" stroke="#d1d5db" /><circle cx="284" cy="147" r="6" fill="none" stroke="#6b7280" stroke-width="1.6"/><path d="M288 151l4 4" stroke="#6b7280" stroke-width="1.6"/><text x="300" y="153" font-size="14" font-weight="400" fill="#9ca3af" text-anchor="start">ค้นหาองค์กร</text><circle cx="278" cy="206" r="10" fill="#e5e7eb"/><text x="298" y="211" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">โรงเรียนวัดสุทธิวราราม</text><line x1="264" x2="544" y1="228" y2="228" stroke="#e5e7eb"/><circle cx="278" cy="250" r="10" fill="#e5e7eb"/><text x="298" y="255" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">โรงเรียนอนุบาลบ้านดอกไม้</text><line x1="264" x2="544" y1="272" y2="272" stroke="#e5e7eb"/><circle cx="278" cy="294" r="10" fill="#e5e7eb"/><text x="298" y="299" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">บริษัท รุ่งเรืองการพิมพ์ จำกัด</text><line x1="264" x2="544" y1="316" y2="316" stroke="#e5e7eb"/><line x1="568" x2="1256" y1="167" y2="167" stroke="#d1d5db"/><text x="620.5679969787598" y="153" font-size="14" font-weight="500" fill="#6b7280" text-anchor="middle">ข้อมูลองค์กร</text><text x="710.4159927368164" y="153" font-size="14" font-weight="600" fill="#2563eb" text-anchor="middle">ผู้ติดต่อ</text><rect x="681.1359939575195" y="165" width="58.55999755859375" height="3" rx="1.5" fill="#2563eb"/><text x="811.0299911499023" y="153" font-size="14" font-weight="500" fill="#6b7280" text-anchor="middle">ราคาตามสัญญา</text><rect x="568" y="184" width="688" height="160" rx="6" fill="#ffffff" stroke="#d1d5db" /><rect x="568.5" y="184.5" width="687" height="39.5" rx="5.5" fill="#f3f4f6"/><text x="580" y="209" font-size="13.5" font-weight="600" fill="#6b7280" text-anchor="start">ชื่อ</text><text x="752" y="209" font-size="13.5" font-weight="600" fill="#6b7280" text-anchor="start">อีเมล</text><text x="924" y="209" font-size="13.5" font-weight="600" fill="#6b7280" text-anchor="start">โทรศัพท์</text><text x="1096" y="209" font-size="13.5" font-weight="600" fill="#6b7280" text-anchor="start">สถานะ</text><line x1="568" x2="1256" y1="224" y2="224" stroke="#d1d5db"/><text x="580" y="249" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">คุณสมหมาย รักเรียน</text><text x="752" y="249" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">sommai@example.test</text><text x="924" y="249" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">081-000-0001</text><text x="1096" y="249" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">ใช้งาน</text><line x1="568" x2="1256" y1="264" y2="264" stroke="#d1d5db"/><text x="580" y="289" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">คุณวิภา ศรีสุข</text><text x="752" y="289" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">wipa@example.test</text><text x="924" y="289" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">081-000-0002</text><text x="1096" y="289" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">ใช้งาน</text><line x1="568" x2="1256" y1="304" y2="304" stroke="#d1d5db"/><text x="580" y="329" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">คุณประสิทธิ์ แก้วดี</text><text x="752" y="329" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">prasit@example.test</text><text x="924" y="329" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">081-000-0003</text><text x="1096" y="329" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">ปิดใช้งาน</text><rect x="568" y="360" width="200" height="40" rx="8" fill="#ffffff" stroke="#d1d5db" /><text x="668" y="385" font-size="15" font-weight="600" fill="#1f2937" text-anchor="middle">สร้างข้อความเชิญ</text><rect x="784" y="360" width="200" height="40" rx="8" fill="#ffffff" stroke="#d1d5db" /><text x="884" y="385" font-size="15" font-weight="600" fill="#1f2937" text-anchor="middle">ลบข้อมูลส่วนบุคคล</text><rect x="568" y="424" width="688" height="112" rx="10" fill="#ffffff" stroke="#d1d5db" /><text x="584" y="453.2" font-size="16" font-weight="600" fill="#1f2937" text-anchor="start"><tspan x="584" >ข้อความเชิญ (คัดลอกได้)</tspan></text><text x="584" y="480.825" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start"><tspan x="584" >เรียนคุณสมหมาย รักเรียน โรงเรียนวัดสุทธิวราราม ร้านจะเชิญเข้าใช้ระบบใบเสนอราคา</tspan><tspan x="584" dy="19.575">ระบบเก็บชื่อ อีเมล และเบอร์โทรที่ทำงานเพื่อติดต่อเรื่องใบเสนอราคา เข้าใช้ได้เมื่อเปิดระยะที่ 2</tspan></text><rect x="1056" y="552" width="200" height="40" rx="8" fill="#ffffff" stroke="#d1d5db" /><text x="1156" y="577" font-size="15" font-weight="600" fill="#1f2937" text-anchor="middle">คัดลอกข้อความ</text><path d="M568 552h454l18 18v46h-472z" fill="#fef9c3" stroke="#eab308"/><path d="M1022 552v18h18" fill="none" stroke="#eab308"/><text x="580" y="574.35" font-size="13" font-weight="400" fill="#713f12" text-anchor="start"><tspan x="580" >แท็บราคาตามสัญญาแสดงรหัสสินค้า ชื่อ และราคาต่อหน่วยขององค์กรที่เลือก การลบ</tspan><tspan x="580" dy="18.849999999999998">ข้อมูลต้องระบุช่องทางและวันที่ได้รับคำขอ</tspan></text></svg>