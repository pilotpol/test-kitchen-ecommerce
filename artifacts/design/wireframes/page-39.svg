omptServe ส่วนผู้สั่งซื้อยังไม่พร้อมใช้งานในรุ่นนี้ จึง</tspan><tspan x="788" dy="18.849999999999998">เปิดไม่ได้</tspan></text><rect x="1056" y="536" width="200" height="40" rx="8" fill="#2563eb" stroke="#2563eb" /><text x="1156" y="561" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">บันทึกค่าตั้ง</text></svg>