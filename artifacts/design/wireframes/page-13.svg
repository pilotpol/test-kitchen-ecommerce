<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="Anuphan, 'Sukhumvit Set', -apple-system, 'Helvetica Neue', sans-serif"><rect width="1280" height="800" fill="#ffffff"/><rect x="0" y="0" width="1280" height="56" rx="0" fill="#ffffff" stroke="none" /><line x1="0" x2="1280" y1="56" y2="56" stroke="#d1d5db"/><rect x="24" y="14" width="28" height="28" rx="6" fill="#e5e7eb" stroke="none" /><text x="62" y="34" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start">ระบบใบเสนอราคาเครื่องเขียน</text><circle cx="1240" cy="28" r="16" fill="#e5e7eb"/><ellipse cx="1020" cy="28" rx="20" ry="20" fill="#e5e7eb"/><text x="1020" y="33" font-size="12.8" font-weight="600" fill="#6b7280" text-anchor="middle">สศ</text><text x="1048" y="29.299999999999997" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start"><tspan x="1048" >สมศรี ใจดี (ผู้ดูแลระบบ)</tspan></text><rect x="0" y="56" width="240" height="744" rx="0" fill="#f3f4f6" stroke="none" /><rect x="24" y="83" width="14" height="14" rx="3" fill="#d1d5db" stroke="none" /><text x="48" y="95" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">คิวคำขอ (3)</text><rect x="24" y="127" width="14" height="14" rx="3" fill="#d1d5db" stroke="none" /><text x="48" y="139" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">บันทึกคำขอแทนลูกค้า</text><rect x="24" y="171" width="14" height="14" rx="3" fill="#d1d5db" stroke="none" /><text x="48" y="183" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">ใบเสนอราคาและคำสั่งซื้อ</text><rect x="24" y="215" width="14" height="14" rx="3" fill="#d1d5db" stroke="none" /><text x="48" y="227" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">สินค้าและสต็อก</text><rect x="24" y="259" width="14" height="14" rx="3" fill="#d1d5db" stroke="none" /><text x="48" y="271" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">องค์กรและผู้ติดต่อ</text><rect x="24" y="303" width="14" height="14" rx="3" fill="#d1d5db" stroke="none" /><text x="48" y="315" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">เจ้าหน้าที่</text><rect x="24" y="347" width="14" height="14" rx="3" fill="#d1d5db" stroke="none" /><text x="48" y="359" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">คำถามที่ส่งต่อ (1)</text><rect x="24" y="391" width="14" height="14" rx="3" fill="#d1d5db" stroke="none" /><text x="48" y="403" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">ตัวชี้วัดและตั้งค่า</text><rect x="12" y="424" width="216" height="36" rx="8" fill="#dbeafe" stroke="none" /><rect x="24" y="435" width="14" height="14" rx="3" fill="#2563eb" stroke="none" /><text x="48" y="447" font-size="14" font-weight="600" fill="#2563eb" text-anchor="start">ประกาศความเป็นส่วนตัว</text><text x="264" y="94.8" font-size="24" font-weight="700" fill="#1f2937" text-anchor="start"><tspan x="264" >ประกาศความเป็นส่วนตัว</tspan></text><rect x="264" y="128" width="992" height="272" rx="10" fill="#ffffff" stroke="#d1d5db" /><text x="280" y="157.2" font-size="16" font-weight="600" fill="#1f2937" text-anchor="start"><tspan x="280" >ข้อมูลส่วนบุคคลที่ระบบเก็บ</tspan></text><text x="280" y="184.825" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start"><tspan x="280" >ชื่อ-นามสกุล อีเมลที่ทำงาน และเบอร์โทรที่ทำงานของผู้ติดต่อ เพื่อระบุผู้ขอและตอบใบเสนอราคา</tspan><tspan x="280" dy="19.575">ชื่อผู้ใช้และชื่อที่แสดงของเจ้าหน้าที่ เพื่อระบุผู้ทำรายการในบันทึกการใช้งาน</tspan><tspan x="280" dy="19.575">ข้อความคำถามแชตที่ปกปิดแล้วเก็บ 90 วัน ไม่เก็บประวัติแชต</tspan><tspan x="280" dy="19.575">ไม่เก็บเลขบัตรประชาชน ที่อยู่ส่วนบุคคล หรือข้อมูลการชำระเงิน</tspan><tspan x="280" dy="19.575">ผู้ติดต่อขอลบข้อมูลได้ที่หน้าองค์กรและผู้ติดต่อ</tspan></text><rect x="264" y="431" width="18" height="18" rx="4" fill="#ffffff" stroke="#d1d5db" /><text x="292" y="445" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">ข้าพเจ้ารับทราบประกาศความเป็นส่วนตัว</text><rect x="264" y="472" width="240" height="40" rx="8" fill="#2563eb" stroke="#2563eb" /><text x="384" y="497" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">รับทราบและเข้าใช้งาน</text><path d="M264 528h974l18 18v30h-992z" fill="#fef9c3" stroke="#eab308"/><path d="M1238 528v18h18" fill="none" stroke="#eab308"/><text x="276" y="550.35" font-size="13" font-weight="400" fill="#713f12" text-anchor="start"><tspan x="276" >แสดงเมื่อเข้าใช้ครั้งแรก ระบบบันทึกเวลารับทราบ และเปิดดูภายหลังได้จากเมนูนี้</tspan></text></svg>