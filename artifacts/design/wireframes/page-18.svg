6" width="160" height="40" rx="8" fill="#ffffff" stroke="#d1d5db" /><text x="736" y="641" font-size="15" font-weight="600" fill="#1f2937" text-anchor="middle">คัดลอกข้อความ</text><path d="M272 680h958l18 18v46h-976z" fill="#fef9c3" stroke="#eab308"/><path d="M1230 680v18h18" fill="none" stroke="#eab308"/><text x="284" y="702.35" font-size="13" font-weight="400" fill="#713f12" text-anchor="start"><tspan x="284" >แอปไม่ส่งอีเมล เจ้าหน้าที่คัดลอกข้อความไปส่งเองนอกแอป ผู้รับเข้าใช้ได้เมื่อเปิดระยะที่ 2 การลบข้อมูลส่วนบุคคลแทนชื่อและล้างอีเมลกับเบอร์โทร คำขอและใบเสนอราคาเดิมยังอยู่</tspan></text></svg>