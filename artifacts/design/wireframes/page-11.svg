<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="Anuphan, 'Sukhumvit Set', -apple-system, 'Helvetica Neue', sans-serif"><rect width="1280" height="800" fill="#ffffff"/><rect x="0" y="0" width="1280" height="64" rx="0" fill="#ffffff" stroke="none" /><line x1="0" x2="1280" y1="64" y2="64" stroke="#d1d5db"/><rect x="24" y="18" width="28" height="28" rx="6" fill="#e5e7eb" stroke="none" /><text x="62" y="38" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start">ระบบใบเสนอราคาเครื่องเขียน</text><circle cx="1240" cy="32" r="16" fill="#e5e7eb"/><text x="1184" y="33.3" font-size="14" font-weight="400" fill="#1f2937" text-anchor="end"><tspan x="1184" >สมศรี ใจดี (เจ้าของแอป)</tspan></text><ellipse cx="1228" cy="32" rx="20" ry="20" fill="#e5e7eb"/><text x="1228" y="37" font-size="12.8" font-weight="600" fill="#6b7280" text-anchor="middle">สศ</text><rect x="0" y="64" width="240" height="736" rx="0" fill="#f3f4f6" stroke="none" /><rect x="24" y="91" width="14" height="14" rx="3" fill="#d1d5db" stroke="none" /><text x="48" y="103" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">คิวคำขอ (5)</text><rect x="24" y="135" width="14" height="14" rx="3" fill="#d1d5db" stroke="none" /><text x="48" y="147" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">บันทึกคำขอแทนลูกค้า</text><rect x="24" y="179" width="14" height="14" rx="3" fill="#d1d5db" stroke="none" /><text x="48" y="191" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">ใบเสนอราคาและคำสั่งซื้อ</text><rect x="24" y="223" width="14" height="14" rx="3" fill="#d1d5db" stroke="none" /><text x="48" y="235" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">สินค้าและสต็อก</text><rect x="24" y="267" width="14" height="14" rx="3" fill="#d1d5db" stroke="none" /><text x="48" y="279" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">องค์กรและผู้ติดต่อ</text><rect x="24" y="311" width="14" height="14" rx="3" fill="#d1d5db" stroke="none" /><text x="48" y="323" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">เจ้าหน้าที่</text><rect x="24" y="355" width="14" height="14" rx="3" fill="#d1d5db" stroke="none" /><text x="48" y="367" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">คำถามที่ส่งต่อ (1)</text><rect x="12" y="388" width="216" height="36" rx="8" fill="#dbeafe" stroke="none" /><rect x="24" y="399" width="14" height="14" rx="3" fill="#2563eb" stroke="none" /><text x="48" y="411" font-size="14" font-weight="600" fill="#2563eb" text-anchor="start">ตัวชี้วัดและตั้งค่า</text><rect x="24" y="443" width="14" height="14" rx="3" fill="#d1d5db" stroke="none" /><text x="48" y="455" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">ประกาศความเป็นส่วนตัว</text><text x="264" y="110.8" font-size="24" font-weight="700" fill="#1f2937" text-anchor="start"><tspan x="264" >ตัวชี้วัดและตั้งค่า</tspan></text><rect x="404" y="230" width="480" height="280" rx="14" fill="rgba(0,0,0,.08)" stroke="none" /><rect x="400" y="224" width="480" height="280" rx="12" fill="#ffffff" stroke="#d1d5db" /><text x="424" y="262" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">ยืนยันการเปิดระยะที่ 2</text><path d="M846 248l10 10m0-10l-10 10" stroke="#6b7280" stroke-width="1.6"/><text x="424" y="297.3" font-size="14" font-weight="400" fill="#6b7280" text-anchor="start"><tspan x="424" >เมื่อเปิดแล้วผู้สั่งซื้อที่มีบัญชีจะเข้าใช้งานได้ โปรดตรวจความพร้อมก่อนยืนยัน</tspan><tspan x="424" dy="20.3">การเปลี่ยนค่าบันทึกในบันทึกการใช้งาน</tspan></text><rect x="648" y="444" width="100" height="38" rx="8" fill="#ffffff" stroke="#d1d5db" /><text x="698" y="468" font-size="14" font-weight="600" fill="#1f2937" text-anchor="middle">ยกเลิก</text><rect x="760" y="444" width="96" height="38" rx="8" fill="#2563eb" stroke="#2563eb" /><text x="808" y="468" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">ยืนยัน</text><rect x="432" y="440" width="184" height="40" rx="8" fill="#ffffff" stroke="#d1d5db" /><text x="524" y="465" font-size="15" font-weight="600" fill="#1f2937" text-anchor="middle">ยกเลิก</text><rect x="648" y="440" width="184" height="40" rx="8" fill="#2563eb" stroke="#2563eb" /><text x="740" y="465" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">ยืนยันเปิด</text></svg>