<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="Anuphan, 'Sukhumvit Set', -apple-system, 'Helvetica Neue', sans-serif"><rect width="1280" height="800" fill="#ffffff"/><rect x="0" y="0" width="1280" height="56" rx="0" fill="#ffffff" stroke="none" /><line x1="0" x2="1280" y1="56" y2="56" stroke="#d1d5db"/><rect x="24" y="14" width="28" height="28" rx="6" fill="#e5e7eb" stroke="none" /><text x="62" y="34" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start">ระบบใบเสนอราคาเครื่องเขียน</text><circle cx="1240" cy="28" r="16" fill="#e5e7eb"/><rect x="0" y="56" width="240" height="480" rx="0" fill="#f3f4f6" stroke="none" /><rect x="24" y="83" width="14" height="14" rx="3" fill="#d1d5db" stroke="none" /><text x="48" y="95" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">คิวคำขอ (5)</text><rect x="24" y="127" width="14" height="14" rx="3" fill="#d1d5db" stroke="none" /><text x="48" y="139" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">บันทึกคำขอแทนลูกค้า</text><rect x="24" y="171" width="14" height="14" rx="3" fill="#d1d5db" stroke="none" /><text x="48" y="183" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">ใบเสนอราคาและคำสั่งซื้อ</text><rect x="24" y="215" width="14" height="14" rx="3" fill="#d1d5db" stroke="none" /><text x="48" y="227" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">สินค้าและสต็อก</text><rect x="24" y="259" width="14" height="14" rx="3" fill="#d1d5db" stroke="none" /><text x="48" y="271" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">องค์กรและผู้ติดต่อ</text><rect x="24" y="303" width="14" height="14" rx="3" fill="#d1d5db" stroke="none" /><text x="48" y="315" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">เจ้าหน้าที่</text><rect x="24" y="347" width="14" height="14" rx="3" fill="#d1d5db" stroke="none" /><text x="48" y="359" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">คำถามที่ส่งต่อ (1)</text><rect x="12" y="380" width="216" height="36" rx="8" fill="#dbeafe" stroke="none" /><rect x="24" y="391" width="14" height="14" rx="3" fill="#2563eb" stroke="none" /><text x="48" y="403" font-size="14" font-weight="600" fill="#2563eb" text-anchor="start">ตัวชี้วัดและตั้งค่า</text><rect x="24" y="435" width="14" height="14" rx="3" fill="#d1d5db" stroke="none" /><text x="48" y="447" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">ประกาศความเป็นส่วนตัว</text><text x="264" y="102.8" font-size="24" font-weight="700" fill="#1f2937" text-anchor="start"><tspan x="264" >ตัวชี้วัดและตั้งค่า</tspan></text><rect x="784" y="381" width="40" height="22" rx="11" fill="#2563eb" stroke="none" /><circle cx="813" cy="392" r="8" fill="#fff"/><text x="836" y="397" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">เปิดใช้งานฝั่งผู้สั่งซื้อ (ระยะที่ 2)</text><rect x="404" y="222" width="480" height="320" rx="14" fill="rgba(0,0,0,.08)" stroke="none" /><rect x="400" y="216" width="480" height="320" rx="12" fill="#ffffff" stroke="#d1d5db" /><text x="424" y="254" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">ยืนยันการเปิดระยะที่ 2</text><path d="M846 240l10 10m0-10l-10 10" stroke="#6b7280" stroke-width="1.6"/><text x="424" y="289.3" font-size="14" font-weight="400" fill="#6b7280" text-anchor="start"><tspan x="424" >เมื่อเปิดแล้ว ผู้สั่งซื้อที่ได้รับเชิญจะเข้าใช้แอปและตอบใบเสนอราคาได้เอง</tspan><tspan x="424" dy="20.3">ผู้สั่งซื้อทุกคนขององค์กรเดียวกันเห็นและยืนยันคำขอและใบเสนอราคาของ</tspan><tspan x="424" dy="20.3">องค์กรได้ทั้งหมด</tspan><tspan x="424" dy="20.3">การเปลี่ยนค่านี้บันทึกใน audit_log</tspan></text><rect x="648" y="476" width="100" height="38" rx="8" fill="#ffffff" stroke="#d1d5db" /><text x="698" y="500" font-size="14" font-weight="600" fill="#1f2937" text-anchor="middle">ยกเลิก</text><rect x="760" y="476" width="96" height="38" rx="8" fill="#2563eb" stroke="#2563eb" /><text x="808" y="500" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">ยืนยัน</text><rect x="560" y="464" width="144" height="40" rx="8" fill="#ffffff" stroke="#d1d5db" /><text x="632" y="489" font-size="15" font-weight="600" fill="#1f2937" text-anchor="middle">ยกเลิก</text><rect x="720" y="464" width="144" height="40" rx="8" fill="#2563eb" stroke="#2563eb" /><text x="792" y="489" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">ยืนยันการเปิด</text></svg>