<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="Anuphan, 'Sukhumvit Set', -apple-system, 'Helvetica Neue', sans-serif"><rect width="1280" height="800" fill="#ffffff"/><rect x="0" y="0" width="1280" height="56" rx="0" fill="#ffffff" stroke="none" /><line x1="0" x2="1280" y1="56" y2="56" stroke="#d1d5db"/><rect x="24" y="14" width="28" height="28" rx="6" fill="#e5e7eb" stroke="none" /><text x="62" y="34" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start">ระบบใบเสนอราคาเครื่องเขียน</text><circle cx="1240" cy="28" r="16" fill="#e5e7eb"/><ellipse cx="1020" cy="28" rx="20" ry="20" fill="#e5e7eb"/><text x="1020" y="33" font-size="12.8" font-weight="600" fill="#6b7280" text-anchor="middle">สศ</text><text x="1048" y="29.299999999999997" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start"><tspan x="1048" >สมศรี ใจดี (ผู้ดูแลระบบ)</tspan></text><rect x="0" y="56" width="240" height="744" rx="0" fill="#f3f4f6" stroke="none" /><rect x="12" y="72" width="216" height="36" rx="8" fill="#dbeafe" stroke="none" /><rect x="24" y="83" width="14" height="14" rx="3" fill="#2563eb" stroke="none" /><text x="48" y="95" font-size="14" font-weight="600" fill="#2563eb" text-anchor="start">คิวคำขอ (5)</text><rect x="24" y="127" width="14" height="14" rx="3" fill="#d1d5db" stroke="none" /><text x="48" y="139" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">บันทึกคำขอแทนลูกค้า</text><rect x="24" y="171" width="14" height="14" rx="3" fill="#d1d5db" stroke="none" /><text x="48" y="183" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">ใบเสนอราคาและคำสั่งซื้อ</text><rect x="24" y="215" width="14" height="14" rx="3" fill="#d1d5db" stroke="none" /><text x="48" y="227" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">สินค้าและสต็อก</text><rect x="24" y="259" width="14" height="14" rx="3" fill="#d1d5db" stroke="none" /><text x="48" y="271" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">องค์กรและผู้ติดต่อ</text><rect x="24" y="303" width="14" height="14" rx="3" fill="#d1d5db" stroke="none" /><text x="48" y="315" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">เจ้าหน้าที่</text><rect x="24" y="347" width="14" height="14" rx="3" fill="#d1d5db" stroke="none" /><text x="48" y="359" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">คำถามที่ส่งต่อ (1)</text><rect x="24" y="391" width="14" height="14" rx="3" fill="#d1d5db" stroke="none" /><text x="48" y="403" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">ตัวชี้วัดและตั้งค่า</text><rect x="24" y="435" width="14" height="14" rx="3" fill="#d1d5db" stroke="none" /><text x="48" y="447" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">ประกาศความเป็นส่วนตัว</text><text x="264" y="91" font-size="20" font-weight="700" fill="#1f2937" text-anchor="start"><tspan x="264" >ออกใบเสนอราคาจากคำขอ QR-2569-0012</tspan></text><path d="M264 128h522l18 18v46h-540z" fill="#fef9c3" stroke="#eab308"/><path d="M786 128v18h18" fill="none" stroke="#eab308"/><text x="276" y="150.35" font-size="13" font-weight="400" fill="#713f12" text-anchor="start"><tspan x="276" >ตัวอย่างหน้า S2a ที่เปิดแผงแชตทางขวา ต้องเลือกองค์กรก่อนถาม ไม่เก็บประวัติแชต</tspan></text><rect x="824" y="72" width="432" height="704" rx="6" fill="#ffffff" stroke="#9ca3af" /><text x="848" y="99.2" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start"><tspan x="848" >ผู้ช่วยแนะนำสินค้า</tspan></text><rect x="848" y="116" width="384" height="40" rx="6" fill="#ffffff" stroke="#d1d5db" /><text x="860" y="141" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">โรงเรียนวัดสุทธิวราราม</text><path d="M1210 133l5 5 5-5" fill="none" stroke="#6b7280" stroke-width="1.6"/><rect x="960" y="176" width="272" height="44" rx="14" fill="#2563eb" stroke="none" /><text x="976" y="201.3" font-size="14" font-weight="400" fill="#ffffff" text-anchor="start"><tspan x="976" >ขอปากกาลูกลื่นสีน้ำเงิน 500 ด้าม</tspan></text><rect x="848" y="236" width="320" height="84" rx="14" fill="#f3f4f6" stroke="none" /><text x="864" y="261.3" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start"><tspan x="864" >มีสินค้า PEN-0101 ปากกาลูกลื่นสีน้ำเงิน ราคาตาม</tspan><tspan x="864" dy="20.3">สัญญา 6.00 บาท ต่อด้าม ราคาสุดท้ายเป็นไปตามใบ</tspan><tspan x="864" dy="20.3">เสนอราคา</tspan></text><rect x="848" y="360" width="384" height="88" rx="10" fill="#ffffff" stroke="#d1d5db" /><text x="864" y="389.2" font-size="16" font-weight="600" fill="#1f2937" text-anchor="start"><tspan x="864" >PEN-0101 ปากกาลูกลื่นสีน้ำเงิน</tspan></text><text x="864" y="416.825" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start"><tspan x="864" >หน่วย ด้าม ราคาตามสัญญา 6.00 บา…</tspan></text><rect x="960" y="464" width="272" height="44" rx="14" fill="#2563eb" stroke="none" /><text x="976" y="489.3" font-size="14" font-weight="400" fill="#ffffff" text-anchor="start"><tspan x="976" >ช่วยลดราคาให้ร้อยละ 20</tspan></text><rect x="848" y="524" width="320" height="84" rx="14" fill="#f3f4f6" stroke="none" /><text x="864" y="549.3" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start"><tspan x="864" >ไม่สามารถตั้งราคาหรือลดราคาได้ กรุณาระบุความ</tspan><tspan x="864" dy="20.3">ต้องการในหมายเหตุของคำขอ เจ้าหน้าที่จะพิจารณา</tspan><tspan x="864" dy="20.3">ในใบเสนอราคา</tspan></text><path d="M848 632h366l18 18v22h-384z" fill="#fef9c3" stroke="#eab308"/><path d="M1214 632v18h18" fill="none" stroke="#eab308"/><text x="860" y="654.35" font-size="13" font-weight="400" fill="#713f12" text-anchor="start"><tspan x="860" >กำลังประมวลผล ปุ่มลองใหม่ปรากฏเมื่อรอเกิน 10 วินาที</tspan></text><rect x="848" y="688" width="296" height="40" rx="6" fill="#ffffff" stroke="#d1d5db" /><text x="860" y="713" font-size="14" font-weight="400" fill="#9ca3af" text-anchor="start">พิมพ์คำถามเกี่ยวกับสินค้า</text><rect x="1152" y="688" width="80" height="40" rx="8" fill="#2563eb" stroke="#2563eb" /><text x="1192" y="713" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">ส่ง</text></svg>