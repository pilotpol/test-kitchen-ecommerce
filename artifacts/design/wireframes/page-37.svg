<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="Anuphan, 'Sukhumvit Set', -apple-system, 'Helvetica Neue', sans-serif"><rect width="1280" height="800" fill="#ffffff"/><rect x="0" y="0" width="1280" height="56" rx="0" fill="#ffffff" stroke="none" /><line x1="0" x2="1280" y1="56" y2="56" stroke="#d1d5db"/><rect x="24" y="14" width="28" height="28" rx="6" fill="#e5e7eb" stroke="none" /><text x="62" y="34" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start">ระบบใบเสนอราคาเครื่องเขียน</text><circle cx="1240" cy="28" r="16" fill="#e5e7eb"/><text x="1163.7019996643066" y="33" font-size="14" font-weight="500" fill="#6b7280" text-anchor="start">ผู้ช่วย</text><text x="1088.0179977416992" y="33" font-size="14" font-weight="500" fill="#6b7280" text-anchor="start">คำสั่งซื้อ</text><text x="934.5359954833984" y="33" font-size="14" font-weight="500" fill="#6b7280" text-anchor="start">คำขอและใบเสนอราคา</text><text x="840.9459991455078" y="33" font-size="14" font-weight="500" fill="#6b7280" text-anchor="start">แคตตาล็อก</text><text x="40" y="102.8" font-size="24" font-weight="700" fill="#1f2937" text-anchor="start"><tspan x="40" >ผู้ช่วยแนะนำสินค้า</tspan></text><rect x="600" y="136" width="640" height="44" rx="14" fill="#2563eb" stroke="none" /><text x="616" y="161.3" font-size="14" font-weight="400" fill="#ffffff" text-anchor="start"><tspan x="616" >มีสมุดบันทึกสำหรับนักเรียนไหม</tspan></text><rect x="40" y="208" width="700" height="64" rx="14" fill="#f3f4f6" stroke="none" /><text x="56" y="233.3" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start"><tspan x="56" >ขอแนะนำ NTB-0203 สมุดบันทึก 80 แกรม ราคาตามสัญญา 18.50 บาท สถานะ มีสินค้า ราคาสุดท้ายเป็นไปตามใบเสนอ</tspan><tspan x="56" dy="20.3">ราคา</tspan></text><path d="M40 328h1182l18 18v30h-1200z" fill="#fef9c3" stroke="#eab308"/><path d="M1222 328v18h18" fill="none" stroke="#eab308"/><text x="52" y="350.35" font-size="13" font-weight="400" fill="#713f12" text-anchor="start"><tspan x="52" >ผู้ช่วยตั้งราคา ลดราคา และออกใบเสนอราคาไม่ได้ ไม่เก็บประวัติแชต</tspan></text><rect x="40" y="704" width="1000" height="40" rx="6" fill="#ffffff" stroke="#d1d5db" /><text x="52" y="729" font-size="14" font-weight="400" fill="#9ca3af" text-anchor="start">พิมพ์คำถามเกี่ยวกับสินค้า</text><rect x="1056" y="704" width="184" height="40" rx="8" fill="#2563eb" stroke="#2563eb" /><text x="1148" y="729" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">ส่ง</text></svg>