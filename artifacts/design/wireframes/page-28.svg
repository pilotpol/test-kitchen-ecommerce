ght="400" fill="#1f2937" text-anchor="start">องค์กรและผู้ติดต่อ</text><rect x="24" y="303" width="14" height="14" rx="3" fill="#d1d5db" stroke="none" /><text x="48" y="315" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">เจ้าหน้าที่</text><rect x="24" y="347" width="14" height="14" rx="3" fill="#d1d5db" stroke="none" /><text x="48" y="359" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">คำถามที่ส่งต่อ (1)</text><rect x="24" y="391" width="14" height="14" rx="3" fill="#d1d5db" stroke="none" /><text x="48" y="403" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">ตัวชี้วัดและตั้งค่า</text><rect x="24" y="435" width="14" height="14" rx="3" fill="#d1d5db" stroke="none" /><text x="48" y="447" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">ประกาศความเป็นส่วนตัว</text><rect x="404" y="206" width="560" height="320" rx="14" fill="rgba(0,0,0,.08)" stroke="none" /><rect x="400" y="200" width="560" height="320" rx="12" fill="#ffffff" stroke="#d1d5db" /><text x="424" y="238" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">ยกเลิกคำขอ QR-2569-0012</text><path d="M926 224l10 10m0-10l-10 10" stroke="#6b7280" stroke-width="1.6"/><text x="424" y="273.3" font-size="14" font-weight="400" fill="#6b7280" text-anchor="start"><tspan x="424" >ระบุเหตุผลที่ยกเลิก คำขอที่ยกเลิกแล้วจะอยู่ในแท็บ ยกเลิก และไม่นับในตัวชี้วัด</tspan></text><rect x="728" y="460" width="100" height="38" rx="8" fill="#ffffff" stroke="#d1d5db" /><text x="778" y="484" font-size="14" font-weight="600" fill="#1f2937" text-anchor="middle">ยกเลิก</text><rect x="840" y="460" width="96" height="38" rx="8" fill="#2563eb" stroke="#2563eb" /><text x="888" y="484" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">ยืนยัน</text><rect x="432" y="328" width="496" height="96" rx="6" fill="#ffffff" stroke="#d1d5db" /><text x="444" y="351.3" font-size="14" font-weight="400" fill="#9ca3af" text-anchor="start"><tspan x="444" 