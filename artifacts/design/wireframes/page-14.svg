<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="Anuphan, 'Sukhumvit Set', -apple-system, 'Helvetica Neue', sans-serif"><rect width="1280" height="800" fill="#ffffff"/><rect x="0" y="0" width="1280" height="56" rx="0" fill="#ffffff" stroke="none" /><line x1="0" x2="1280" y1="56" y2="56" stroke="#d1d5db"/><rect x="24" y="14" width="28" height="28" rx="6" fill="#e5e7eb" stroke="none" /><text x="62" y="34" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start">ระบบใบเสนอราคาเครื่องเขียน</text><circle cx="1240" cy="28" r="16" fill="#e5e7eb"/><ellipse cx="1068" cy="28" rx="20" ry="20" fill="#e5e7eb"/><text x="1068" y="33" font-size="12.8" font-weight="600" fill="#6b7280" text-anchor="middle">ผท</text><text x="1096" y="29.299999999999997" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start"><tspan x="1096" >ผู้ใช้ทดสอบ</tspan></text><rect x="400" y="200" width="480" height="160" rx="10" fill="#ffffff" stroke="#d1d5db" /><text x="416" y="229.2" font-size="16" font-weight="600" fill="#1f2937" text-anchor="start"><tspan x="416" >ยังไม่ได้รับสิทธิ์ใช้งาน</tspan></text><text x="416" y="256.825" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start"><tspan x="416" >บัญชีนี้ยังไม่ได้รับสิทธิ์ใช้งาน กรุณาติดต่อผู้ดูแลระบบ</tspan></text><rect x="540" y="392" width="200" height="40" rx="8" fill="#ffffff" stroke="#d1d5db" /><text x="640" y="417" font-size="15" font-weight="600" fill="#1f2937" text-anchor="middle">ออกจากระบบ</text><path d="M400 456h462l18 18v30h-480z" fill="#fef9c3" stroke="#eab308"/><path d="M862 456v18h18" fill="none" stroke="#eab308"/><text x="412" y="478.35" font-size="13" font-weight="400" fill="#713f12" text-anchor="start"><tspan x="412" >บัญชีที่ถูกปิดเห็นหน้านี้เช่นกัน และเรียก API ฝั่งเจ้าหน้าที่ได้ 403</tspan></text></svg>