<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="Anuphan, 'Sukhumvit Set', -apple-system, 'Helvetica Neue', sans-serif"><rect width="1280" height="800" fill="#ffffff"/><rect x="0" y="0" width="1280" height="56" rx="0" fill="#ffffff" stroke="none" /><line x1="0" x2="1280" y1="56" y2="56" stroke="#d1d5db"/><rect x="24" y="14" width="28" height="28" rx="6" fill="#e5e7eb" stroke="none" /><text x="62" y="34" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start">ระบบใบเสนอราคาเครื่องเขียน</text><circle cx="1240" cy="28" r="16" fill="#e5e7eb"/><ellipse cx="1020" cy="28" rx="20" ry="20" fill="#e5e7eb"/><text x="1020" y="33" font-size="12.8" font-weight="600" fill="#6b7280" text-anchor="middle">สศ</text><text x="1048" y="29.299999999999997" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start"><tspan x="1048" >สมศรี ใจดี (ผู้ดูแลระบบ)</tspan></text><rect x="0" y="56" width="240" height="744" rx="0" fill="#f3f4f6" stroke="none" /><rect x="24" y="83" width="14" height="14" rx="3" fill="#d1d5db" stroke="none" /><text x="48" y="95" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">คิวคำขอ (5)</text><rect x="24" y="127" width="14" height="14" rx="3" fill="#d1d5db" stroke="none" /><text x="48" y="139" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">บันทึกคำขอแทนลูกค้า</text><rect x="12" y="160" width="216" height="36" rx="8" fill="#dbeafe" stroke="none" /><rect x="24" y="171" width="14" height="14" rx="3" fill="#2563eb" stroke="none" /><text x="48" y="183" font-size="14" font-weight="600" fill="#2563eb" text-anchor="start">ใบเสนอราคาและคำสั่งซื้อ</text><rect x="24" y="215" width="14" height="14" rx="3" fill="#d1d5db" stroke="none" /><text x="48" y="227" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">สินค้าและสต็อก</text><rect x="24" y="259" width="14" height="14" rx="3" fill="#d1d5db" stroke="none" /><text x="48" y="271" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">องค์กรและผู้ติดต่อ</text><rect x="24" y="303" width="14" height="14" rx="3" fill="#d1d5db" stroke="none" /><text x="48" y="315" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">เจ้าหน้าที่</text><rect x="24" y="347" width="14" height="14" rx="3" fill="#d1d5db" stroke="none" /><text x="48" y="359" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">คำถามที่ส่งต่อ (1)</text><rect x="24" y="391" width="14" height="14" rx="3" fill="#d1d5db" stroke="none" /><text x="48" y="403" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">ตัวชี้วัดและตั้งค่า</text><rect x="24" y="435" width="14" height="14" rx="3" fill="#d1d5db" stroke="none" /><text x="48" y="447" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">ประกาศความเป็นส่วนตัว</text><text x="272" y="102.8" font-size="24" font-weight="700" fill="#1f2937" text-anchor="start"><tspan x="272" >บันทึกคำตอบของลูกค้า QT-2569-0010-R0</tspan></text><rect x="1048" y="88" width="200" height="32" rx="16" fill="#dbeafe" stroke="none" /><text x="1148" y="108.5" font-size="12.5" font-weight="600" fill="#2563eb" text-anchor="middle">ออกแล้ว รอลูกค้าตอบ</text><rect x="272" y="136" width="480" height="96" rx="10" fill="#ffffff" stroke="#d1d5db" /><text x="288" y="165.2" font-size="16" font-weight="600" fill="#1f2937" text-anchor="start"><tspan x="288" >โรงเรียนอนุบาลบ้านดอกไม้</tspan></text><text x="288" y="192.825" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start"><tspan x="288" >ออกเมื่อ 20 พ.ย. 2569 หมดอายุ 20 ธ.ค. 2569</tspan><tspan x="288" dy="19.575">ยอดสุทธิ 12,626.00 บาท</tspan></text><rect x="768" y="136" width="480" height="96" rx="10" fill="#ffffff" stroke="#d1d5db" /><text x="784" y="165.2" font-size="16" font-weight="600" fill="#1f2937" text-anchor="start"><tspan x="784" >คำสั่งซื้อ SO-2569-0007 สถานะ ยืนยันแล้ว</tspan></text><text x="784" y="192.825" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start"><tspan x="784" >ระบบสร้างหลังบันทึกคำตอบยืนยัน</tspan><tspan x="784" dy="19.575">ดาวน์โหลด PDF ได้</tspan></text><text x="272" y="262.25" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start"><tspan x="272" >คำตอบของลูกค้า</tspan></text><circle cx="281" cy="296" r="9" fill="#ffffff" stroke="#2563eb"/><circle cx="281" cy="296" r="5" fill="#2563eb"/><text x="300" y="301" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">ลูกค้ายืนยัน</text><circle cx="521" cy="296" r="9" fill="#ffffff" stroke="#d1d5db"/><text x="540" y="301" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">ลูกค้าปฏิเสธ</text><circle cx="761" cy="296" r="9" fill="#ffffff" stroke="#d1d5db"/><text x="780" y="301" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">ลูกค้าขอแก้ไข</text><rect x="272" y="328" width="976" height="104" rx="10" fill="#ffffff" stroke="#d1d5db" /><text x="288" y="357.2" font-size="16" font-weight="600" fill="#1f2937" text-anchor="start"><tspan x="288" >ผลของแต่ละคำตอบ</tspan></text><text x="288" y="384.825" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start"><tspan x="288" >ยืนยัน สร้างคำสั่งซื้อยืนยันแล้ว 1 รายการ ปฏิเสธ ต้องระบุเหตุผล คำขอปิดแล้ว</tspan><tspan x="288" dy="19.575">ขอแก้ไข คำขอกลับเข้าคิวและนับเวลารอใหม่</tspan></text><text x="272" y="462.25" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start"><tspan x="272" >ช่องทางที่ลูกค้าตอบ</tspan></text><text x="592" y="462.25" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start"><tspan x="592" >วันและเวลาที่ลูกค้าตอบ</tspan></text><rect x="272" y="472" width="304" height="40" rx="6" fill="#ffffff" stroke="#d1d5db" /><text x="284" y="497" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">อีเมล</text><path d="M554 489l5 5 5-5" fill="none" stroke="#6b7280" stroke-width="1.6"/><rect x="592" y="472" width="304" height="40" rx="6" fill="#ffffff" stroke="#d1d5db" /><text x="604" y="497" font-size="14" font-weight="400" fill="#9ca3af" text-anchor="start">24 พ.ย. 2569 14:30 น.</text><text x="272" y="534.25" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start"><tspan x="272" >หมายเหตุหลักฐาน (จำเป็น)</tspan></text><rect x="272" y="544" width="976" height="88" rx="6" fill="#ffffff" stroke="#d1d5db" /><text x="284" y="567.3" font-size="14" font-weight="400" fill="#9ca3af" text-anchor="start"><tspan x="284" >ลูกค้าตอบยืนยันทางอีเมลเมื่อวันที่ 24 พ.ย. 2569 หัวเรื่อง ยืนยันใบเสนอราคา</tspan></text><path d="M1242 618l-8 8M1242 623l-3 3" stroke="#9ca3af"/><path d="M272 648h958l18 18v22h-976z" fill="#fef9c3" stroke="#eab308"/><path d="M1230 648v18h18" fill="none" stroke="#eab308"/><text x="284" y="670.35" font-size="13" font-weight="400" fill="#713f12" text-anchor="start"><tspan x="284" >ใบเสนอราคาที่หมดอายุ ถูกแทนที่ หรือตอบแล้ว บันทึกไม่ได้ ต้องกรอกเหตุผลเมื่อเลือกปฏิเสธ</tspan></text><rect x="272" y="704" width="120" height="40" rx="6" fill="#ffffff" stroke="#9ca3af" /><text x="332" y="727.15" font-size="14" font-weight="400" fill="#6b7280" text-anchor="middle"><tspan x="332" >ยกเลิก</tspan></text><rect x="808" y="704" width="240" height="40" rx="8" fill="#ffffff" stroke="#d1d5db" /><text x="928" y="729" font-size="15" font-weight="600" fill="#1f2937" text-anchor="middle">ดาวน์โหลด PDF ใบเสนอราคา</text><rect x="1064" y="704" width="184" height="40" rx="8" fill="#2563eb" stroke="#2563eb" /><text x="1156" y="729" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">บันทึกคำตอบ</text></svg>