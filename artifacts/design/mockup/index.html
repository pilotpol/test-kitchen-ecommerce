<title>Mockup ระบบใบเสนอราคาเครื่องเขียน</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Sukhumvit Set","Sarabun",sans-serif;font-size:14px;color:#1d2733;background:#f5f7fa}
#mockbar{position:sticky;top:0;z-index:60;background:#fff3bf;border-bottom:1px solid #e0c85a;padding:6px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:13px}
#mockbar select{font:inherit;padding:2px 4px}
#mockbar b{color:#7a5b00}
.appbar{height:52px;background:#16324f;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:0 20px}
.brand{font-weight:700;font-size:16px}
.user{display:flex;align-items:center;gap:10px}
.av{width:32px;height:32px;border-radius:50%;background:#4f86c0;display:inline-flex;align-items:center;justify-content:center;font-size:13px}
.layout{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 92px)}
.side{background:#eaf0f7;padding:12px 0;border-right:1px solid #d3dde9}
.side a{display:flex;justify-content:space-between;align-items:center;padding:10px 18px;color:#1d3a5a;text-decoration:none;border-left:4px solid transparent}
.side a:hover{background:#dce7f4}
.side a.on{background:#d0e0f2;border-left-color:#1f5fa8;font-weight:700}
.cnt{background:#c0392b;color:#fff;border-radius:10px;font-size:12px;padding:1px 8px}
main{padding:24px 28px;min-width:0}
.pagehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px}
h1{font-size:21px;margin:0}
h2{font-size:16px;margin:0 0 10px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px}
.card{background:#fff;border:1px solid #d9e1ea;border-radius:8px;padding:16px;margin-bottom:14px}
.cards .card{margin-bottom:0}
.big{font-size:24px;font-weight:700;margin-top:4px}
.muted{color:#5f6f80;font-size:13px}
.btn{font:inherit;border-radius:6px;border:1px solid #1f5fa8;background:#fff;color:#1f5fa8;padding:8px 16px;cursor:pointer}
.btn.primary{background:#1f5fa8;color:#fff}
.btn.danger{border-color:#b03a2e;color:#b03a2e}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:3px 10px;font-size:13px}
a.lnk{color:#1f5fa8;cursor:pointer;text-decoration:underline}
table.t{width:100%;border-collapse:collapse;background:#fff;border:1px solid #d9e1ea}
.t th{background:#eef2f7;text-align:left;padding:9px 10px;font-size:13px;border-bottom:1px solid #d9e1ea}
.t td{padding:9px 10px;border-bottom:1px solid #edf1f5;vertical-align:middle}
.t tr.click{cursor:pointer}
.t tr.click:hover td{background:#f2f7fd}
.t td.r,.t th.r{text-align:right}
.badge{display:inline-block;border-radius:10px;padding:2px 10px;font-size:12px;background:#e6ebf1;color:#33465a;white-space:nowrap}
.b-green{background:#d9f0e0;color:#17623a}.b-red{background:#f9dcd8;color:#9a2a1d}.b-amber{background:#fdecc4;color:#7a5200}.b-blue{background:#d9e8f8;color:#174f8a}.b-grey{background:#e6ebf1;color:#4a5968}
.tabs{display:flex;gap:4px;margin:10px 0}
.tabs button{font:inherit;border:1px solid #cfd9e5;background:#fff;padding:7px 16px;cursor:pointer;border-radius:6px}
.tabs button.on{background:#1f5fa8;color:#fff;border-color:#1f5fa8}
input,select,textarea{font:inherit;padding:7px 9px;border:1px solid #b9c6d4;border-radius:6px;background:#fff;max-width:100%}
.search{width:320px;margin-bottom:10px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:#33465a}
label input,label select,label textarea{font-size:14px;color:#1d2733}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pin{width:110px;text-align:right}
.warn{background:#fff6dd;border:1px solid #e8cf85;border-radius:6px;padding:8px 12px;margin-bottom:8px;color:#6d4c00}
.err{background:#fdeceb;border:1px solid #e3a49c;border-radius:6px;padding:8px 12px;margin-bottom:10px;color:#8a2519}
.ok{background:#e4f5ea;border:1px solid #9fd3b0;border-radius:6px;padding:8px 12px;margin-bottom:10px;color:#17623a}
.info{background:#e8f1fb;border:1px solid #b5cfee;border-radius:6px;padding:8px 12px;margin-bottom:10px;color:#17436f}
.actions{display:flex;gap:10px;justify-content:flex-end;align-items:center;margin-top:12px}
.sumrow{display:flex;justify-content:space-between;padding:4px 0}
.sumrow.tot{font-weight:700;border-top:1px solid #d9e1ea;margin-top:4px;padding-top:8px}
.statebox{background:#fff;border:1px dashed #b9c6d4;border-radius:8px;padding:48px;text-align:center;color:#4a5968}
.spin{width:34px;height:34px;border:4px solid #d0dbe8;border-top-color:#1f5fa8;border-radius:50%;margin:0 auto 12px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#modal{position:fixed;inset:0;background:rgba(20,30,45,.45);display:none;align-items:center;justify-content:center;z-index:80}
#modal.show{display:flex}
.mbox{background:#fff;border-radius:10px;width:560px;max-width:94vw;max-height:90vh;overflow:auto;padding:20px}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#1d2733;color:#fff;padding:10px 20px;border-radius:8px;display:none;z-index:90;max-width:90vw}
#toast.bad{background:#9a2a1d}
.drawer{position:fixed;right:0;top:40px;bottom:0;width:400px;background:#fff;border-left:1px solid #b9c6d4;box-shadow:-4px 0 14px rgba(0,0,0,.12);z-index:40;display:flex;flex-direction:column}
.dhead{padding:12px 14px;border-bottom:1px solid #d9e1ea;display:flex;justify-content:space-between;align-items:center}
.dbody{padding:12px;overflow:auto;flex:1;background:#f5f7fa}
.dfoot{padding:10px;border-top:1px solid #d9e1ea;display:flex;gap:8px}
.dfoot input{flex:1}
.msg{margin:8px 0;padding:9px 12px;border-radius:10px;max-width:90%;white-space:pre-wrap}
.msg.u{background:#d0e0f2;margin-left:auto}
.msg.a{background:#fff;border:1px solid #d9e1ea}
.pc{border:1px solid #cfd9e5;border-radius:6px;padding:6px 10px;margin-top:6px;background:#fafcff;font-size:13px}
.chips button{font:inherit;font-size:12px;border:1px solid #b9c6d4;background:#fff;border-radius:12px;padding:3px 10px;cursor:pointer;margin:2px}
.orgs button{display:block;width:100%;text-align:left;font:inherit;padding:9px 10px;border:0;border-bottom:1px solid #edf1f5;background:#fff;cursor:pointer}
.orgs button.on{background:#d0e0f2;font-weight:700}
.center{max-width:520px;margin:60px auto;text-align:center}
pre.inv{white-space:pre-wrap;background:#f5f7fa;border:1px solid #d9e1ea;padding:10px;border-radius:6px;font-family:inherit}
@media(max-width:900px){.layout{grid-template-columns:1fr}.side{display:flex;overflow:auto}.cards,.grid2,.grid3,.split{grid-template-columns:1fr}.drawer{width:100%}}

 if(disc)w+='<div class="warn">คำเตือน: '+disc+' รายการเลิกขาย ต้องตัดออกหรือใส่สินค้าทดแทน</div>';
 q$('#warn2a',w);

 var b=document.getElementById('issueBtn');if(b)b.disabled=(miss>0||disc>0);
}
function issueQuote(){
 var r=getReq(S.reqId),d=S.draft,e=[];
 d.forEach(function(l,i){if(l.price==null)e.push('บรรทัดที่ '+(i+1)+' ('+l.sku+'): ยังไม่มีราคาต่อหน่วย');if(prod(l.sku).status==='discontinued')e.push('บรรทัดที่ '+(i+1)+' ('+l.sku+'): สินค้าเลิกขาย');});
 if(e.length){S.err2a=e;render();return;}

 qs.forEach(function(q){if(q.status==='revision_requested')q.status='superseded';});
 var code=r.code.replace('QR','QT')+'-R'+qs.length;
 S.quotes.push({code:code,req:r.code,rev:qs.length,status:'issued',issuedStr:NOWSTR,issued:NOW,valid:fmtDate(NOW+S.settings.validity*864e5),items:d.map(function(l){return {sku:l.sku,qty:l.qty,price:l.price};})});
 r.status='quoted';S.draftFor=null;S.err2a=null;S.quoteId=code;
 toast('ออกใบเสนอราคา '+code+' แล้ว (จำลอง)');
 go('s2b');
}

 }

function recordResp(){
 var q=getQ(S.quoteId),f=S.f2b,e=[];
 if(q.status!=='issued'){toast('ใบเสนอราคานี้ไม่อยู่ในสถานะที่รับคำตอบได้ (409)',1);return;}
 var t=parseTh(f.at);
 if(t==null)e.push('วันและเวลาที่ลูกค้าตอบ: รูปแบบไม่ถูกต้อง เช่น 24 พ.ย. 2569 14:30 น.');
 else if(t<q.issued)e.push('วันและเวลาที่ลูกค้าตอบ: ต้องไม่ก่อนวันที่ออกใบเสนอราคา ('+q.issuedStr+')');
 else if(t>NOW+5*60000)e.push('วันและเวลาที่ลูกค้าตอบ: ต้องไม่อยู่ในอนาคต');
 if(!f.note.trim())e.push('หมายเหตุหลักฐาน: จำเป็นต้องระบุ');
 if(f.d==='reject'&&!f.reason.trim())e.push('เหตุผลที่ปฏิเสธ: จำเป็นต้องระบุ');
 if(e.length){S.err2b=e;render();return;}
 var r=getReq(q.req);
 q.resp={ch:f.ch,at:f.at,note:f.note.trim(),reason:f.d==='reject'?f.reason.trim():''};
 if(f.d==='confirm'){q.status='confirmed';r.status='closed';var oc=nextCode('SO');S.orders.push({code:oc,quote:q.code,at:fmtDate(t)});toast('บันทึกคำตอบแล้ว เกิดคำสั่งซื้อ '+oc+' สถานะยืนยันแล้ว (จำลอง)');}
 else if(f.d==='reject'){q.status='rejected';r.status='closed';toast('บันทึกว่าลูกค้าปฏิเสธแล้ว คำขอปิดแล้ว (จำลอง)');}
 else{q.status='revision_requested';r.status='pending_quote';r.wait=0.5;toast('บันทึกว่าลูกค้าขอแก้ไขแล้ว คำขอกลับเข้าคิว (จำลอง)');}
 S.err2b=null;S.f2b={d:'confirm',ch:'email',at:'24 พ.ย. 2569 14:30 น.',note:'',reason:''};
 render();
}

function saveProd(){

 if(e.length){q$('#perr','<div class="err">'+e.map(esc).join('<br>')+'</div>');return;}
 var p=n?{sku:sku,status:'active',stock:st}:prod(sku);
 p.name=g('pf_name');p.cat=g('pf_cat');p.unit=g('pf_unit');p.list=pr;p.kw=g('pf_kw');p.desc=g('pf_desc');

 '<div class="card"><h2>ส่วนสำหรับผู้สั่งซื้อ (ระยะที่ 2)</h2><label style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" disabled> เปิดให้ผู้สั่งซื้อเข้าใช้งาน</label>'+(adm?'<div class="info" style="margin-top:8px">ส่วนผู้สั่งซื้อยังไม่พร้อมใช้งานในรุ่นนี้</div>':'<div class="info" style="margin-top:8px">อ่านอย่างเดียว เฉพาะผู้ดูแลระบบเปลี่ยนค่านี้ได้</div>')+'</div>';
};
function saveSet(){

 var vn=+v,tn=+t;
 if(v===''||!isFinite(vn)||vn<1||vn>180||Math.floor(vn)!==vn)e.push('อายุใบเสนอราคา: ต้องเป็นจำนวนเต็ม 1 ถึง 180 วัน');
 if(t===''||!isFinite(tn)||tn<0||tn>20)e.push('อัตราภาษี: ต้องอยู่ระหว่างร้อยละ 0 ถึง 20');

}

 '<p class="muted">ร้านไม่เก็บเลขบัตรประชาชน ที่อยู่ส่วนบุคคล ข้อมูลการชำระเงิน และประวัติแชต</p>'+
 (S.priv?'<div class="ok">รับทราบแล้วเมื่อ '+S.priv+'</div>':'<div class="actions"><button class="btn primary" onclick="S.priv=NOWSTR;toast(\'บันทึกการรับทราบแล้ว (จำลอง)\');render()">รับทราบประกาศความเป็นส่วนตัว</button></div>')+'</div>';

/* E1 */

 return userBar()+'<div class="center card"><h1>ยังไม่ได้รับสิทธิ์ใช้งาน</h1><p>บัญชีนี้ยังไม่ได้รับสิทธิ์ใช้งาน กรุณาติดต่อผู้ดูแลระบบ</p><p class="muted">หน้านี้ไม่แสดงข้อมูลใดของแอป</p></div>';

/* S9 chat */
function openChat(from){
 S.chatBase=from;
 var o=from==='s2a'?String(getReq(S.reqId).org):String(S.f8.org||'');
 if(S.chat.org!==o){S.chat.org=o;S.chat.msgs=[];}
 go('s9');
}
function drawer(){
 return '<div class="drawer"><div class="dhead"><b>แชตผู้ช่วย</b><button class="btn sm" onclick="go(S.chatBase)">ปิด</button></div><div class="dbody"><label style="margin-bottom:8px">องค์กรที่เลือก<select onchange="chatOrg(this.value)"><option value="">เลือกองค์กร</option>'+S.orgs.map(function(o){return '<option value="'+o.id+'" '+(S.chat.org==o.id?'selected':'')+'>'+esc(o.name)+'</option>';}).join('')+'</select></label><div class="chips"><button onclick="chip(\'มีปากกาลูกลื่นสีน้ำเงินไหม\')">มีปากกาลูกลื่นสีน้ำเงินไหม</button><button onclick="chip(\'ขอส่วนลด 20 เปอร์เซ็นต์\')">ขอส่วนลด</button><button onclick="chip(\'สินค้าชำรุด ขอคุยกับเจ้าหน้าที่\')">ร้องเรียนสินค้าชำรุด</button><button onclick="chip(\'ขอเก้าอี้สำนักงาน\')">สินค้าที่ไม่มีในแคตตาล็อก</button></div><div id="chatmsgs">'+chatMsgs()+'</div></div><div class="dfoot"><input id="chatin" maxlength="1000" placeholder="พิมพ์คำถามเกี่ยวกับสินค้า" onkeydown="if(event.key===\'Enter\')chatSend()"><button class="btn primary" onclick="chatSend()">ส่ง</button></div></div>';
}
function chatMsgs(){
 if(!S.chat.msgs.length)return '<div class="muted">ถามเรื่องสินค้าได้ ผู้ช่วยอ้างเฉพาะสินค้าในแคตตาล็อกและไม่ตั้งราคาหรือออกใบเสนอราคา</div>';
 return S.chat.msgs.map(function(m){
  if(m.r==='u')return '<div class="msg u">'+esc(m.t)+'</div>';
  if(m.r==='w')return '<div class="msg a muted">กำลังประมวลผล...</div>';
  return '<div class="msg a">'+esc(m.t)+(m.p||[]).map(function(p){var cp=cPrice(S.chat.org,p.sku);return '<div class="pc"><b>'+p.sku+'</b> '+esc(p.name)+'<br>หน่วย '+p.unit+' | '+(cp==null?'ราคาตามใบเสนอราคา':baht(cp)+' บาท')+' | '+(p.stock>0?'มีสินค้า':'สินค้าหมด')+'</div>';}).join('')+(m.esc?'<div class="muted" style="margin-top:6px">ส่งเรื่องถึงเจ้าหน้าที่แล้ว (คิว S6)</div>':'')+'</div>';
 }).join('');
}
function chatOrg(v){S.chat.org=v;S.chat.msgs=[];q$('#chatmsgs',chatMsgs());}
function chip(t){document.getElementById('chatin').value=t;chatSend();}
function maskT(t){return t.replace(/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/g,'[อีเมล]').replace(/(\+66|0)[\s-]?\d([\s-]?\d){7,8}/g,'[เบอร์โทร]');}
function chatSend(){
 var inp=document.getElementById('chatin'),t=inp.value.trim();
 if(!t)return;
 if(!S.chat.org){toast('กรุณาเลือกองค์กรก่อนถาม',1);return;}
 if(t.length>1000){toast('ข้อความยาวเกิน 1,000 ตัวอักษร',1);return;}
 var m=maskT(t);inp.value='';
 S.chat.msgs.push({r:'u',t:m});S.chat.msgs.push({r:'w'});
 q$('#chatmsgs',chatMsgs());
 setTimeout(function(){S.chat.msgs.pop();S.chat.msgs.push(chatReply(m));q$('#chatmsgs',chatMsgs());refreshNav();},700);
}
function addEsc(m,cat,conf,reason){S.esc.unshift({id:S.esc.length+1+Math.floor(Math.random()*1000),org:+S.chat.org,q:m,cat:cat,conf:conf,reason:reason,status:'open',at:NOWSTR,by:'ผู้ช่วยแชต'});}
function chatReply(m){
 var l=m.toLowerCase();
 if(/ร้องเรียน|ขอคุยกับเจ้าหน้าที่|ชำรุด/.test(m)){addEsc(m,'complaint',0.95,'complaint');return {r:'a',t:'ขออภัยในความไม่สะดวก ระบบส่งเรื่องถึงเจ้าหน้าที่แล้ว เจ้าหน้าที่จะตรวจสอบและติดต่อกลับ',esc:true};}
 if(/ส่วนลด|ลดราคา|ต่อรอง|ออกใบเสนอราคา|ตั้งราคา/.test(m))return {r:'a',t:'ขออภัย ผู้ช่วยไม่สามารถตั้งราคา ลดราคา ต่อรองราคา หรือออกใบเสนอราคาได้ กรุณาบันทึกคำขอพร้อมระบุความต้องการในหมายเหตุ เจ้าหน้าที่จะเป็นผู้เสนอราคา'};
 if(/แบบเดิม|เมื่อปีก่อน/.test(m)){addEsc(m,'process_question',0.42,'low_confidence');return {r:'a',t:'ขออภัย ข้อมูลยังไม่เพียงพอที่จะระบุสินค้า กรุณาระบุชื่อหรือรหัสสินค้า ระบบส่งคำถามนี้ให้เจ้าหน้าที่ช่วยตรวจสอบแล้ว',esc:true};}
 var found=S.products.filter(function(p){
  if(p.status!=='active')return false;
  var terms=[p.sku,p.name,p.cat].concat(p.kw.split(',').map(function(x){return x.trim();})).filter(Boolean);
  return terms.some(function(x){return l.indexOf(x.toLowerCase())>=0;});
 }).slice(0,5);
 if(found.length)return {r:'a',t:'พบสินค้าที่เกี่ยวข้องในแคตตาล็อก ดังนี้ ราคาสุดท้ายเป็นไปตามใบเสนอราคา',p:found};
 return {r:'a',t:'ไม่พบสินค้าที่เกี่ยวข้องในแคตตาล็อก แนะนำให้บันทึกคำขอพร้อมระบุรายละเอียดในหมายเหตุ'};
}

/* router */
function render(){
 var id=(location.hash||'#s1').slice(1);
 if(!SCREENS.some(function(s){return s.id===id;}))id='s1';
 var view=id==='s9'?S.chatBase:id;
 document.getElementById('selScreen').value=id;
 document.getElementById('selMode').value=S.mode;
 document.getElementById('selState').value=S.vstate;
 var app=document.getElementById('app');
 var name=SCREENS.filter(function(s){return s.id===view;})[0].name;
 document.title='Mockup '+name;
 if(S.mode==='none'||id==='e1'){app.innerHTML=e1html();return;}
 var inner;
 if(S.vstate!=='ok'&&view!=='s10')inner=stateBox(name.replace(/^\S+\s/,''));
 else inner=V[view]();
 app.innerHTML=shell(activeOf(view),inner);
 if(S.vstate==='ok'&&INIT[view])INIT[view]();
 if(id==='s9'){app.insertAdjacentHTML('beforeend',drawer());var d=document.getElementById('chatmsgs');if(d)d.parentNode.scrollTop=d.parentNode.scrollHeight;}
 window.scrollTo(0,0);
}
(function(){
 var sel=document.getElementById('selScreen');
 sel.innerHTML=SCREENS.map(function(s){return '<option value="'+s.id+'">'+esc(s.name)+'  ('+esc(s.route)+')</option>';}).join('');
 window.addEventListener('hashchange',render);
 document.getElementById('modal').addEventListener('click',function(e){if(e.target===this)closeModal();});
 render();
})();
</script>
