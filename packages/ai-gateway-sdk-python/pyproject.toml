[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "promptserv"
version = "0.1.0"
description = "Python client for the PromptServe AI Gateway"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
# One dependency on purpose. This SDK is installed into other people's
# applications, and every dependency it adds is one they may already have at a
# different version.
dependencies = ["httpx>=0.24"]

[project.optional-dependencies]
dev = ["pytest>=7", "respx>=0.20"]

[tool.hatch.build.targets.wheel]
packages = ["promptserv"]
